; PlatformIO Project Configuration File
;
; Migrated from the Arduino / SquareLine "meterClock/Clock" project.
;
; Target board: Waveshare ESP32-C6-Touch-AMOLED-2.16
;   - MCU     : ESP32-C6 (RISC-V), Wi-Fi 6 + BLE 5
;   - Display : 2.16" 480x480 AMOLED, SH8601 (QSPI)
;   - PMIC    : AXP2101 (I2C 0x34, ALDO3 = display reset/backlight rail)
;   - RTC     : PCF85063A (I2C 0x51)
;   - Touch   : CST9217 (I2C 0x5A)
;
; NOTE: This project uses the "new" ESP-IDF I2C master driver
;       (driver/i2c_master.h, i2c_new_master_bus) which requires
;       Arduino-ESP32 core 3.x / ESP-IDF >= 5.2. The stock PlatformIO
;       "espressif32" platform ships Arduino core 2.x, so the community
;       pioarduino platform (Arduino core 3.3.12 / IDF 5.5.5) is used here.

[env:esp32c6-amoled-216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; 16 MB flash, 80 MHz, QIO - matches the Waveshare board / factory firmware
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Large app partition table (LVGL + Wi-Fi + TLS) - see partitions.csv.
board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3

lib_deps =
  lvgl/lvgl@^8.3.11
  lewisxhe/XPowersLib@^0.3.3

; OpenThread Border Router (single-SoC ESP32-C6).
; Enables the IDF features that are OFF in the prebuilt Arduino libs via pioarduino's
; Arduino "hybrid compile" (custom_sdkconfig). Mirrors
; framework-espidf/examples/openthread/ot_br/sdkconfig.defaults, plus
; CONFIG_OPENTHREAD_RADIO_NATIVE (the C6 default is SPINEL_UART = external RCP).
custom_sdkconfig =
  CONFIG_OPENTHREAD_ENABLED=y
  CONFIG_OPENTHREAD_RADIO_NATIVE=y
  CONFIG_OPENTHREAD_FTD=y
  CONFIG_OPENTHREAD_BORDER_ROUTER=y
  CONFIG_OPENTHREAD_BORDER_AGENT_ENABLE=y
  CONFIG_MBEDTLS_CMAC_C=y
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
  CONFIG_MBEDTLS_ECJPAKE_C=y
  CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE=y
  CONFIG_LWIP_IPV6_FORWARD=y
  CONFIG_LWIP_IPV6_NUM_ADDRESSES=12
  CONFIG_LWIP_MULTICAST_PING=y
  CONFIG_LWIP_NETIF_STATUS_CALLBACK=y
  CONFIG_LWIP_HOOK_IP6_ROUTE_DEFAULT=y
  CONFIG_LWIP_HOOK_ND6_GET_GW_DEFAULT=y
  CONFIG_MDNS_STRICT_MODE=y
  CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=3584

; Managed components (esp_insights / esp_rainmaker) embed server certs, but the
; Arduino hybrid compile does not generate the `.crt.S` sources they expect, and
; its Arduino link list omits the OpenThread border-router glue archive.
; These pre-build scripts patch both gaps.
extra_scripts =
  pre:scripts/sdkconfig_guard.py
  pre:scripts/embed_certs.py
  pre:scripts/link_openthread_br.py
